<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Ciclo - Sistema de gestión del consumo responsable</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --danger-color: #e53935;
            --warning-color: #fdd835;
            --success-color: #43a047;
            --info-color: #1976d2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9; }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #1b5e20; }

        .traffic-light-item {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-red { background-color: #ffebee; border-left: 5px solid var(--danger-color); }
        .status-yellow { background-color: #fffde7; border-left: 5px solid var(--warning-color); }
        .status-green { background-color: #e8f5e9; border-left: 5px solid var(--success-color); }

        .tag {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .tag-red { background: var(--danger-color); color: white; }
        .tag-yellow { background: var(--warning-color); color: #333; }
        .tag-green { background: var(--success-color); color: white; }

        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .btn-consume { background-color: var(--success-color); }
        .btn-freeze { background-color: var(--info-color); }
        .btn-compost { background-color: #795548; }
        .btn-trash { background-color: var(--danger-color); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>Casa Ciclo</h1>
        <p>Sistema de gestión del consumo responsable</p>
    </header>

    <div class="container">
        
        <!-- Módulo de Inventario de Alimentos -->
        <div class="card">
            <h2>🍎 Inventario de Alimentos</h2>
            <form id="foodForm">
                <label for="foodInput">Alimento:</label>
                <input list="foodDatabase" id="foodInput" placeholder="Escribe o busca un alimento..." required>
                <datalist id="foodDatabase"></datalist>

                <label for="foodQty">Cantidad (kg / unidades):</label>
                <input type="number" id="foodQty" min="0.01" step="any" placeholder="Ej. 0.5" required>

                <button type="submit">Agregar al Inventario</button>
            </form>

            <h3 style="margin-top: 25px; font-size: 1.1rem;">Inventario Activo (Semáforo Dinámico)</h3>
            <div id="foodList"></div>
        </div>

        <!-- Módulo de Historial y Cierre -->
        <div class="card">
            <h2>📜 Historial de Alimentos y Auditoría</h2>
            <table>
                <thead>
                    <tr>
                        <th>Fecha Cierre</th>
                        <th>Alimento</th>
                        <th>Cantidad</th>
                        <th>Estado Final</th>
                        <th>Días Restantes</th>
                    </tr>
                </thead>
                <tbody id="historyList"></tbody>
            </table>
        </div>

    </div>

    <script>
        // Catálogo de vida útil teórica (en días)
        const foodCatalog = {
            "Pollo fresco": 2, "Carne de res": 3, "Pescado fresco": 1, "Manzana": 10,
            "Plátano / Banano": 4, "Leche fresca": 3, "Queso fresco": 5, "Tomate": 4,
            "Lechuga": 3, "Papa / Patata": 20, "Pan": 3, "Huevo": 21
        };

        // Estado global del sistema
        let appData = {
            foods: [],
            history: []
        };

        window.onload = function() {
            populateDatalist();
            loadLocalStorage();
            renderAll();
        };

        function populateDatalist() {
            const datalist = document.getElementById('foodDatabase');
            datalist.innerHTML = '';
            Object.keys(foodCatalog).forEach(food => {
                const opt = document.createElement('option');
                opt.value = food;
                datalist.appendChild(opt);
            });
        }

        function loadLocalStorage() {
            try {
                const saved = localStorage.getItem('casaCicloPhase1');
                if (saved) {
                    appData = JSON.parse(saved);
                }
            } catch (e) {
                console.error("Fallo crítico en almacenamiento local, reiniciando estado:", e);
                appData = { foods: [], history: [] };
            }
        }

        function saveData() {
            localStorage.setItem('casaCicloPhase1', JSON.stringify(appData));
            renderAll();
        }

        // Lógica de registro con soporte estricto de decimales y fechas relativas
        document.getElementById('foodForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('foodInput').value.trim();
            const qtyInput = parseFloat(document.getElementById('foodQty').value);

            if (!nameInput || isNaN(qtyInput) || qtyInput <= 0) return;

            const totalShelfLife = foodCatalog[nameInput] || 5; 
            const todayStr = new Date().toISOString().split('T')[0];

            appData.foods.push({
                id: Date.now(),
                name: nameInput,
                qty: qtyInput,
                shelfLifeDays: totalShelfLife,
                dateAdded: todayStr
            });

            document.getElementById('foodForm').reset();
            saveData();
        });

        // Cálculo dinámico de días restantes en tiempo real
        function getRemainingDays(item) {
            const addedDate = new Date(item.dateAdded);
            const currentDate = new Date();
            const diffTime = currentDate - addedDate;
            const elapsedDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return item.shelfLifeDays - elapsedDays;
        }

        // Cierre con los 4 botones obligatorios y regla estricta de salvado
        function closeFood(id, actionType) {
            const index = appData.foods.findIndex(f => f.id === id);
            if (index === -1) return;

            const item = appData.foods[index];
            const remainingDays = getRemainingDays(item);

            const wasCritical = remainingDays <= 5;
            const isSaved = wasCritical && (actionType === 'Consumido' || actionType === 'Congelado' || actionType === 'Compostado');

            const historyEntry = {
                id: Date.now(),
                name: item.name,
                qty: item.qty,
                dateClosed: new Date().toISOString().split('T')[0],
                finalState: actionType,
                remainingDaysAtClose: remainingDays,
                isSaved: isSaved
            };

            appData.history.push(historyEntry);
            appData.foods.splice(index, 1);
            saveData();
        }

        // Renderizado del DOM
        function renderAll() {
            const foodListDiv = document.getElementById('foodList');
            foodListDiv.innerHTML = '';

            appData.foods.forEach(item => {
                const remaining = getRemainingDays(item);
                let statusClass = 'status-green';
                let tagClass = 'tag-green';
                let statusText = 'Fresco';

                if (remaining <= 2) {
                    statusClass = 'status-red';
                    tagClass = 'tag-red';
                    statusText = 'Urgente';
                } else if (remaining <= 5) {
                    statusClass = 'status-yellow';
                    tagClass = 'tag-yellow';
                    statusText = 'Consumo Próximo';
                }

                foodListDiv.innerHTML += `
                    <div class="traffic-light-item ${statusClass}">
                        <div>
                            <strong>${item.name}</strong> — ${item.qty} kg/unid
                            <br><span class="tag ${tagClass}">${statusText}: ${remaining} días restantes</span>
                        </div>
                        <div class="action-buttons">
                            <button class="action-btn btn-consume" onclick="closeFood(${item.id}, 'Consumido')">Consumido</button>
                            <button class="action-btn btn-freeze" onclick="closeFood(${item.id}, 'Congelado')">Congelado</button>
                            <button class="action-btn btn-compost" onclick="closeFood(${item.id}, 'Compostado')">Compostado</button>
                            <button class="action-btn btn-trash" onclick="closeFood(${item.id}, 'Botado')">Botado</button>
                        </div>
                    </div>
                `;
            });

            const historyBody = document.getElementById('historyList');
            historyBody.innerHTML = '';
            appData.history.slice().reverse().forEach(h => {
                historyBody.innerHTML += `
                    <tr>
                        <td>${h.dateClosed}</td>
                        <td>${h.name}</td>
                        <td>${h.qty}</td>
                        <td><strong>${h.finalState}</strong> ${h.isSaved ? '🌱 (Salvado)' : ''}</td>
                        <td>${h.remainingDaysAtClose} días</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
