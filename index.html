<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Ciclo - Gestión Automatizada</title>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #81c784;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --danger-color: #e53935;
            --warning-color: #fdd835;
            --success-color: #43a047;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-title h1 { margin: 0; font-size: 1.8rem; }
        .header-title p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9; }

        .mode-selector {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-box {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 5px solid var(--primary-color);
        }

        .stat-box h3 { margin: 0; font-size: 0.9rem; color: #1b5e20; }
        .stat-box p { font-size: 1.4rem; font-weight: bold; margin: 5px 0 0 0; }

        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: #1b5e20; }
        .btn-secondary { background-color: #555; }
        .btn-secondary:hover { background-color: #333; }

        .traffic-light-item {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }

        .status-red { background-color: #ffebee; border-left: 5px solid var(--danger-color); }
        .status-yellow { background-color: #fffde7; border-left: 5px solid var(--warning-color); }
        .status-green { background-color: #e8f5e9; border-left: 5px solid var(--success-color); }

        .tag {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .tag-red { background: var(--danger-color); color: white; }
        .tag-yellow { background: var(--warning-color); color: #333; }
        .tag-green { background: var(--success-color); color: white; }

        .action-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-left: 5px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Casa Ciclo</h1>
            <p>Sistema Automatizado de Consumo Responsable</p>
        </div>
        <div class="mode-selector">
            <label for="appMode"><strong>Modo:</strong></label>
            <select id="appMode" onchange="toggleMode()">
                <option value="hogar">🏠 Hogar</option>
                <option value="colegio">🏫 Colegio / Comedor</option>
            </select>
        </div>
    </header>

    <div class="container">
        
        <!-- Panel de Impacto -->
        <div class="card" style="margin-bottom: 20px;">
            <h2>Panel de Impacto Unificado (<span id="modeLabel">Hogar</span>)</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>CO₂ Evitado Acumulado</h3>
                    <p id="totalCO2">0 kg</p>
                </div>
                <div class="stat-box">
                    <h3>Ahorro Económico</h3>
                    <p id="totalSoles">S/ 0</p>
                </div>
            </div>
            <button class="btn-secondary" onclick="exportToCSV()">📥 Exportar Reporte CSV</button>
        </div>

        <div class="grid">

            <!-- Módulo Alimentos con Buscador -->
            <div class="card">
                <h2>🍎 Inventario de Alimentos</h2>
                <form id="foodForm">
                    <label for="foodInput">Busca o selecciona un alimento:</label>
                    <input list="foodDatabase" id="foodInput" placeholder="Escribe un alimento (ej. Manzana, Pollo...)" required>
                    <datalist id="foodDatabase"></datalist>

                    <label for="foodQty">Cantidad (unidades / kg enteros):</label>
                    <input type="number" id="foodQty" min="1" step="1" value="1" required>

                    <button type="submit">Agregar al Inventario</button>
                </form>

                <h3 style="margin-top: 20px; font-size: 1rem;">Estado del Inventario</h3>
                <div id="foodList"></div>
            </div>

            <!-- Módulo Energía -->
            <div class="card">
                <h2>⚡ Monitoreo de Energía</h2>
                <form id="energyForm">
                    <label for="applianceSelect">Selecciona el artefacto:</label>
                    <select id="applianceSelect" required>
                        <option value="Refrigeradora">Refrigeradora</option>
                        <option value="Televisor LED">Televisor LED</option>
                        <option value="Foco LED">Foco LED</option>
                        <option value="Microondas">Microondas</option>
                        <option value="Computadora/Laptop">Computadora / Laptop</option>
                        <option value="Ventilador">Ventilador</option>
                        <option value="Hervidor Eléctrico">Hervidor Eléctrico</option>
                    </select>
                    <button type="submit">Registrar Artefacto</button>
                </form>

                <h3 style="margin-top: 20px; font-size: 1rem;">Aparatos Registrados</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Equipo</th>
                            <th>kWh/Mes</th>
                            <th>S/ Est.</th>
                        </tr>
                    </thead>
                    <tbody id="energyList"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        // Base de datos de alimentos con días estimados automáticos de caducidad
        const foodCatalog = {
            // Frutas
            "Manzana": 10, "Plátano / Banano": 4, "Naranja": 12, "Mandarina": 8, "Fresa": 2, 
            "Uva": 5, "Mango": 5, "Papaya": 4, "Piña": 5, "Pera": 6, "Durazno": 4, "Limón": 14,
            "Palta / Aguacate": 3, "Sandía": 6, "Melón": 5, "Arándanos": 4, "Ciruela": 5,
            
            // Verduras y Tubérculos
            "Tomate": 4, "Lechuga": 3, "Zanahoria": 12, "Papa / Patata": 20, "Cebolla": 20,
            "Ajo": 30, "Espinaca": 3, "Brócoli": 4, "Pepino": 5, "Pimiento": 7, "Calabaza": 15,
            "Camote": 20, "Choclo / Maíz": 5, "Vainita": 5, "Zapallo": 10,

            // Carnes y Pescados
            "Pollo fresco": 2, "Carne de res": 3, "Carne de cerdo": 3, "Pescado fresco": 1,
            "Mariscos": 1, "Jamón / Embutidos": 5, "Salchicha": 5,

            // Lácteos y Huevos
            "Leche fresca": 3, "Queso fresco": 5, "Yogurt": 10, "Huevo": 21, "Mantequilla": 30,

            // Panadería y Abarrotes
            "Pan": 3, "Arroz": 180, "Fideos / Pasta": 180, "Avena": 120, "Lentejas / Menestras": 180,
            "Aceite": 180, "Atún en lata": 365
        };

        const defaultAppliances = {
            "Refrigeradora": { watts: 200, hours: 24, phantom: true },
            "Televisor LED": { watts: 100, hours: 4, phantom: true },
            "Foco LED": { watts: 10, hours: 5, phantom: false },
            "Microondas": { watts: 1200, hours: 0.5, phantom: true },
            "Computadora/Laptop": { watts: 65, hours: 6, phantom: false },
            "Ventilador": { watts: 50, hours: 6, phantom: false },
            "Hervidor Eléctrico": { watts: 1500, hours: 0.3, phantom: false }
        };

        let appData = {
            mode: 'hogar',
            foods: [],
            appliances: [],
            totalCO2: 0,
            totalSoles: 0
        };

        window.onload = function() {
            populateDatalist();
            const saved = localStorage.getItem('casaCicloData');
            if (saved) {
                appData = JSON.parse(saved);
                document.getElementById('appMode').value = appData.mode;
            }
            renderAll();
        };

        function populateDatalist() {
            const datalist = document.getElementById('foodDatabase');
            datalist.innerHTML = '';
            Object.keys(foodCatalog).forEach(food => {
                const option = document.createElement('option');
                option.value = food;
                datalist.appendChild(option);
            });
        }

        function saveData() {
            localStorage.setItem('casaCicloData', JSON.stringify(appData));
            renderAll();
        }

        function toggleMode() {
            appData.mode = document.getElementById('appMode').value;
            saveData();
        }

        // --- REGISTRO DE ALIMENTOS ---
        document.getElementById('foodForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('foodInput').value.trim();
            const qty = parseInt(document.getElementById('foodQty').value, 10);

            if (!nameInput || isNaN(qty) || qty < 1) return;

            // Busca días configurados o asigna 5 por defecto si escribe un alimento nuevo
            const days = foodCatalog[nameInput] || 5;

            appData.foods.push({ id: Date.now(), name: nameInput, qty: Math.round(qty), days });
            document.getElementById('foodForm').reset();
            document.getElementById('foodQty').value = 1;
            saveData();
        });

        function consumeFood(id) {
            const food = appData.foods.find(f => f.id === id);
            if (food) {
                appData.totalCO2 += Math.round(food.qty * 2); 
                appData.totalSoles += Math.round(food.qty * 4);
                appData.foods = appData.foods.filter(f => f.id !== id);
                saveData();
            }
        }

        // --- REGISTRO DE ENERGÍA ---
        document.getElementById('energyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const selectedKey = document.getElementById('applianceSelect').value;
            const config = defaultAppliances[selectedKey];

            const kwhMonth = Math.round(((config.watts * config.hours * 30) / 1000));
            const costMonth = Math.round(kwhMonth * 0.85); 

            appData.appliances.push({ 
                id: Date.now(), 
                name: selectedKey, 
                kwhMonth, 
                costMonth, 
                isPhantom: config.phantom 
            });
            saveData();
        });

        // --- RENDERIZADO VISUAL ---
        function renderAll() {
            document.getElementById('modeLabel').innerText = appData.mode === 'hogar' ? 'Hogar' : 'Colegio / Comedor';
            document.getElementById('totalCO2').innerText = Math.round(appData.totalCO2) + ' kg';
            document.getElementById('totalSoles').innerText = 'S/ ' + Math.round(appData.totalSoles);

            const foodListDiv = document.getElementById('foodList');
            foodListDiv.innerHTML = '';
            
            appData.foods.sort((a, b) => a.days - b.days).forEach(item => {
                let statusClass = 'status-green';
                let tagClass = 'tag-green';
                let statusText = 'Fresco';

                if (item.days <= 2) {
                    statusClass = 'status-red';
                    tagClass = 'tag-red';
                    statusText = 'Urgente';
                } else if (item.days <= 5) {
                    statusClass = 'status-yellow';
                    tagClass = 'tag-yellow';
                    statusText = 'Consumo Próximo';
                }

                foodListDiv.innerHTML += `
                    <div class="traffic-light-item ${statusClass}">
                        <div>
                            <strong>${item.name}</strong> (${item.qty} unid/kg)
                            <br><span class="tag ${tagClass}">${statusText}: aprox. ${item.days} días</span>
                        </div>
                        <button class="action-btn" onclick="consumeFood(${item.id})">Consumido ✓</button>
                    </div>
                `;
            });

            const energyBody = document.getElementById('energyList');
            energyBody.innerHTML = '';
            appData.appliances.forEach(item => {
                energyBody.innerHTML += `
                    <tr>
                        <td>${item.name} ${item.isPhantom ? '👻' : ''}</td>
                        <td>${item.kwhMonth}</td>
                        <td>S/ ${item.costMonth}</td>
                    </tr>
                `;
            });
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Casa Ciclo - Reporte de Impacto\n";
            csvContent += `Modo,${appData.mode}\n`;
            csvContent += `CO2 Evitado Total (kg),${Math.round(appData.totalCO2)}\n`;
            csvContent += `Ahorro Total (Soles),${Math.round(appData.totalSoles)}\n\n`;
            
            csvContent += "Inventario de Alimentos\nNombre,Cantidad,Dias Restantes\n";
            appData.foods.forEach(f => {
                csvContent += `${f.name},${f.qty},${f.days}\n`;
            });

            csvContent += "\nAparatos Registrados\nNombre,kWh Mensual,Costo Mensual (S/)\n";
            appData.appliances.forEach(a => {
                csvContent += `${a.name},${a.kwhMonth},${a.costMonth}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Reporte_CasaCiclo_${appData.mode}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
